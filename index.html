    localStorage.removeItem('knot_onboard_v2'); bd.remove(); showOnboarding();
  };
  bd.querySelector('[data-k="clearDrafts"]').onclick = () => {
    localStorage.removeItem(FP); toast('Черновики очищены'); uiHaptic('success');
  };
}

function statusStripHtml(users) {
  const online = (users || []).filter(u => isOnline(u.last_seen)).slice(0, 10);
  return `<div class="statusStrip">
    <div class="statusItem statusAdd" onclick="toast('Статус — скоро')"><div class="statusRing"><div class="inner">+</div></div><div class="nm">Мой статус</div></div>
    ${online.map(u => {
      const letter = (u.first_name||'?')[0];
      const bg = u.photo_url ? `background-image:url('${u.photo_url}')` : `background:${getGradient(u.first_name+(u.last_name||'')+u.id)}`;
      return `<div class="statusItem" onclick="openChat(${u.id})"><div class="statusRing"><div class="inner"><div class="av" style="${bg}">${u.photo_url?'':letter}</div></div></div><div class="nm">${esc(u.first_name||'')}</div></div>`;
    }).join('')}
  </div>`;
}

function headerElevate() {
  const v = view();
  if (!v) return;
  v.addEventListener('scroll', () => {
    header().classList.toggle('elevated', v.scrollTop > 8);
  }, {passive:true});
}

// Patch quickReact for fullscreen burst
const _qr = typeof quickReact === 'function' ? quickReact : null;
if (_qr) {
  window.quickReact = async function(id, emoji) {
    rxBurstFull(emoji);
    return _qr(id, emoji);
  };
}

// Enhance setHeaderMain with settings gear
const _setHeaderMain = typeof setHeaderMain === 'function' ? setHeaderMain : null;
if (_setHeaderMain) {
  window.setHeaderMain = function() {
    _setHeaderMain();
    const r = $('headerRight');
    if (r && !r.querySelector('#setBtn')) {
      const b = document.createElement('button');
      b.className = 'icon-btn';
      b.id = 'setBtn';
      b.innerHTML = '⚙️';
      b.onclick = openSettingsHub;
      r.appendChild(b);
    }
  };
}

// Inject status strip into people
const _renderUsers = typeof renderUsers === 'function' ? renderUsers : null;
if (_renderUsers) {
  window.renderUsers = function(users) {
    _renderUsers(users);
    const body = $('peopleBody');
    if (body && !body.querySelector('.statusStrip') && users?.length) {
      body.insertAdjacentHTML('afterbegin', statusStripHtml(users));
    }
  };
}

// Input focus class
document.addEventListener('focusin', e => {
  if (e.target?.id === 'msgInput') $('inputBar')?.classList.add('focus');
});
document.addEventListener('focusout', e => {
  if (e.target?.id === 'msgInput') $('inputBar')?.classList.remove('focus');
});

// TTL chip display
const _pickTTL = typeof pickTTL === 'function' ? pickTTL : null;
if (_pickTTL) {
  window.pickTTL = function() {
    _pickTTL();
    // after pick, tool chip is shown via pendingExpires observer
  };
}

function updateTTLChip() {
  document.querySelectorAll('.toolChip').forEach(e => e.remove());
  if (!pendingExpires || !currentChat) return;
  const chip = document.createElement('div');
  chip.className = 'toolChip';
  const labels = {10:'10 сек',60:'1 мин',3600:'1 час',86400:'24 часа'};
  chip.innerHTML = `⏱ ${labels[pendingExpires]||pendingExpires+'с'} <button onclick="pendingExpires=null;this.parentElement.remove()">✕</button>`;
  const bar = $('inputBar');
  if (bar) bar.parentElement.insertBefore(chip, bar);
}

// Wrap pendingExpires assignment by proxy-like checks on send attach
const origPickTTL = window.pickTTL;
window.pickTTL = function() {
  const bd = document.createElement('div');
  bd.className = 'backdrop';
  bd.style.cssText = 'padding:0;align-items:flex-end';
  bd.onclick = e => { if (e.target === bd) bd.remove(); };
  bd.innerHTML = `<div class="sheet ttlSheet"><div class="sheetTitle">⏱ Секретное сообщение<button class="sheetClose" onclick="this.closest('.backdrop').remove()">✕</button></div>
    <button data-s="10">🔥 10 секунд</button>
    <button data-s="60">⚡ 1 минута</button>
    <button data-s="3600">🕐 1 час</button>
    <button data-s="86400">📅 24 часа</button>
    <button data-s="0">Без таймера</button></div>`;
  document.body.appendChild(bd);
  bd.querySelectorAll('[data-s]').forEach(b => {
    b.onclick = () => {
      const s = parseInt(b.dataset.s);
      pendingExpires = s || null;
      updateTTLChip();
      toast(s ? `⏱ Удалится через ${b.textContent.replace(/^\\S+\\s/, '')}` : 'Таймер снят');
      bd.remove();
      uiHaptic('light');
    };
  });
};

// Long-press context bar enhancement
const _showPicker = typeof showPicker === 'function' ? showPicker : null;
if (_showPicker) {
  window.showPicker = function(el) {
    _showPicker(el);
  };
}

// Confetti + onboard on start
setTimeout(showOnboarding, 500);

// Header elevate on chat list scroll
const _switchTab = typeof switchTab === 'function' ? switchTab : null;
if (_switchTab) {
  window.switchTab = function(name) {
    _switchTab(name);
    setTimeout(headerElevate, 100);
  };
}

// Send button ready state
document.addEventListener('input', e => {
  if (e.target?.id === 'msgInput') {
    const btn = $('sendBtn');
    if (btn) btn.classList.toggle('ready', !btn.disabled);
  }
});

/* end ultra ui */

renderTabs();
(async()=>{
  try{
    const {user}=await api('/api/me'); meUser=user;
    connectWS();
    setInterval(()=>{ api('/api/presence',{method:'POST',body:JSON.stringify({}),silent:true}).catch(()=>{}); }, 45000);
    const chatParam=new URLSearchParams(location.search).get('chat');
    if(chatParam) openChat(parseInt(chatParam));
    else switchTab('chats');
    updateBadge();
  }catch(e){ view().innerHTML=`<div class="empty"><div class="t">Ошибка</div><div class="d">${esc(e.message)}</div></div>`; }
})();
</script>
</body>
